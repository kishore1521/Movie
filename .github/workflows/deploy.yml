name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'   # every Monday: refresh posters, stills and trailers
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch posters, stills and trailers from TMDB
        run: node scripts/fetch-tmdb.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
